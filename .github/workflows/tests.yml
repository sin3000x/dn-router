# 在支持的 Python 版本上安装锁定依赖，运行回归测试及命令行冒烟检查。
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # 严格按锁文件安装，避免 CI 与本地依赖版本漂移。
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked dn-router examples/input-multi.json --time-limit-ms 500
