[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dn-router"
version = "0.1.0"
description = "Open-route delivery planning with mandatory DNs and unlimited heterogeneous vehicles"
requires-python = ">=3.11"
dependencies = ["numpy>=2.4,<3", "ortools==9.15.6755", "pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
dn-router = "dn_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dn_router = ["report.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
include = ["src", "tests", "scripts"]
